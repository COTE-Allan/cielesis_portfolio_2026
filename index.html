<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cielesis_portfolio_2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- rounded icon library, used through <RoundIcon name="..." /> -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&display=block"
    />
    <!-- restores the saved settings before the first paint, so the page does not fade into them
         (same attributes as applySettings in src/components/settings/settings.js). -->
    <script>
      try {
        const root = document.documentElement;
        const theme = JSON.parse(localStorage.getItem('theme'));
        const settings = JSON.parse(localStorage.getItem('settings')) || {};
        const reduce = typeof settings.reduceMotion === 'boolean'
          ? settings.reduceMotion
          : matchMedia('(prefers-reduced-motion: reduce)').matches;

        if (theme === 'light' || theme === 'dark') root.dataset.theme = theme;
        root.dataset.motion = reduce ? 'reduce' : 'full';
        if (settings.highContrast === true) root.dataset.contrast = 'high';
        if (settings.plainBackground === true) root.dataset.background = 'plain';
        if (settings.strongFocus === true) root.dataset.focus = 'strong';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
